<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Survivor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#02030b;
    color:white;
}

body{
    touch-action:none;
    user-select:none;
}

#game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    transition:
        background 4s linear;

    background:
        radial-gradient(circle at center,
        #14295f 0%,
        #04091b 60%,
        #010106 100%);

}

#starfield{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:0;

    pointer-events:none;

}

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:20;
    transition:.35s;
}

.hidden{
    display:none!important;
}

.logo{
    font-size:clamp(35px,9vw,70px);
    font-weight:900;
    letter-spacing:5px;
    text-align:center;
    color:white;
    text-shadow:0 0 10px #6288ff,0 0 25px #3e64ff,0 0 50px #243dff;
    margin-bottom:25px;
}

.subtitle{
    color:#aab7df;
    margin-bottom:35px;
    font-size:15px;
    text-align:center;
}

button{
    border:none;
    cursor:pointer;
    color:white;
    font-size:18px;
    font-weight:bold;
    padding:17px 48px;
    border-radius:18px;
    background:linear-gradient(135deg,#557bff,#783dff);
    box-shadow:0 0 20px rgba(84,116,255,.5),inset 0 1px 1px rgba(255,255,255,.4);
    transition:.2s;
}

button:active{
    transform:scale(.94);
}

.high-score{
    margin-top:35px;
    padding:13px 25px;
    border-radius:14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    color:#dfe6ff;
    font-size:14px;
}

.high-score strong{
    color:#7f9dff;
    font-size:19px;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.hud-box{
    padding:9px 13px;
    border-radius:12px;
    background:rgba(4,7,25,.65);
    border:1px solid rgba(145,164,255,.22);
    backdrop-filter:blur(8px);
    font-size:13px;
    color:#b8c5ef;
}

.hud-box strong{
    color:white;
    font-size:17px;
}

#hearts{
    font-size:22px;
    letter-spacing:3px;
    filter:drop-shadow(0 0 5px #ff3d5e);
}

#player{

    position:absolute;
    width:65px;
    height:78px;

    left:50%;
    top:80%;

    transform:translate(-50%,-50%);

    z-index:5;

    font-size:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    filter:drop-shadow(0 0 8px #5d8dff)
           drop-shadow(0 0 18px #3e5eff);

    will-change:transform;

}

#player::after{

    content:"";

    position:absolute;

    left:50%;
    top:100%;

    transform:translateX(-50%);

    width:18px;

    height:calc(20px + var(--engine) * 35px);

    border-radius:50%;

    background:
    linear-gradient(
        #ffffff,
        #82d6ff,
        #3a8dff,
        transparent
    );

    filter:blur(3px);

    opacity:.9;

    transition:
        height .08s linear,
        opacity .08s linear;

}

@keyframes engine{
    from{height:25px;opacity:.7}
    to{height:42px;opacity:1}
}

.bullet{
    position:absolute;
    width:5px;
    height:21px;
    border-radius:10px;
    background:#dff6ff;
    box-shadow:0 0 6px #fff,0 0 15px #5ed5ff,0 0 25px #319bff;
    z-index:3;
    will-change:transform;
}

.meteor{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    z-index:4;
    filter:drop-shadow(0 0 8px #ff633d);
    will-change:transform;
    overflow: visible;
}

.meteorTrail{

    position:absolute;

    left:50%;
    top:-60px;

    transform:translateX(-50%);

    width:14px;
    height:80px;

    border-radius:50%;

    background:linear-gradient(

        to top,

        rgba(255,255,255,.9) 0%,
        rgba(255,230,120,.9) 20%,
        rgba(255,150,40,.7) 45%,
        rgba(255,80,20,.35) 70%,
        transparent 100%

    );

    filter:blur(5px);

    opacity:.9;

    animation:trailPulse .25s infinite alternate;

    pointer-events:none;

}

@keyframes trailPulse{

    from{

        transform:
        translateX(-50%)
        scaleY(.9);

        opacity:.7;

    }

    to{

        transform:
        translateX(-50%)
        scaleY(1.1);

        opacity:1;

    }

}

.meteor-health{
    position:absolute;
    top:-9px;
    left:5px;
    right:5px;
    height:5px;
    border-radius:10px;
    background:rgba(0,0,0,.7);
    overflow:hidden;
}

.meteor-health-bar{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ff344e,#ffb13b);
    transition:.1s;
}

.explosion{
    position:absolute;
    z-index:8;
    font-size:42px;
    pointer-events:none;
    animation:explode .45s forwards;
}

@keyframes explode{
    0%{transform:scale(.4);opacity:1}
    100%{transform:scale(2.4);opacity:0}
}

#game-over{
    background:rgba(0,0,8,.72);
    backdrop-filter:blur(8px);
    z-index:30;
    text-align:center;
}

.game-over-title{
    font-size:clamp(32px,8vw,58px);
    font-weight:900;
    color:#ff526d;
    text-shadow:0 0 15px #ff263f,0 0 35px #a8001c;
    margin-bottom:22px;
}

.final-score{
    font-size:20px;
    color:#e2e6ff;
    line-height:1.8;
    margin-bottom:30px;
}

.final-score strong{
    color:#8ea7ff;
    font-size:28px;
}

.game-buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
    justify-content:center;
}

.game-buttons button:last-child{
    background:rgba(255,255,255,.1);
    box-shadow:none;
    border:1px solid rgba(255,255,255,.18);
}

#touch-hint{
    position:absolute;
    bottom:13px;
    left:0;
    right:0;
    text-align:center;
    color:rgba(255,255,255,.35);
    font-size:11px;
    z-index:2;
}

.shield{

    position:absolute;

    width:92px;
    height:92px;

    border-radius:50%;

    border:3px solid #7ed8ff;

    box-shadow:
        0 0 12px #68d4ff,
        0 0 35px #3bbcff,
        inset 0 0 18px rgba(120,220,255,.5);

    animation:shieldPulse .9s infinite alternate;

    pointer-events:none;

    z-index:4;

}

@keyframes shieldPulse{

    from{

        transform:translate(-50%,-50%) scale(.95);

        opacity:.7;

    }

    to{

        transform:translate(-50%,-50%) scale(1.05);

        opacity:1;

    }

}


.shielded::before{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:90px;
    height:90px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:3px solid #74dcff;

    box-shadow:
        0 0 12px cyan,
        0 0 30px #47c6ff,
        inset 0 0 18px rgba(110,220,255,.45);

    animation:shieldPulse .8s infinite alternate;

}


.shieldBlink::before{

    content:"";

    position:absolute;

    width:92px;
    height:92px;

    border-radius:50%;

    border:3px solid #8be4ff;

    animation:blink .15s infinite;

}

@keyframes blink{

    50%{

        opacity:0;

    }

}

.fallingShieldAura{

    position:absolute;

    left:50%;
    top:50%;

    width:85px;
    height:85px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:3px solid #73dcff;

    box-shadow:
        0 0 12px #6ad7ff,
        0 0 25px #44c6ff,
        inset 0 0 15px rgba(100,220,255,.5);

    animation:shieldPulse .8s infinite alternate;

}

@keyframes screenShake{

    0%  { transform:translate(0px,0px); }

    15% { transform:translate(-4px,2px); }

    30% { transform:translate(4px,-2px); }

    45% { transform:translate(-3px,-3px); }

    60% { transform:translate(3px,2px); }

    75% { transform:translate(-2px,3px); }

    100%{ transform:translate(0px,0px); }

}

.shake{

    animation:screenShake .18s;

}


/*Poeer Creep*/

.spark{

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    pointer-events:none;

    box-shadow:0 0 8px currentColor;

}










</style>
</head>

<body>

<div id="game">

<canvas id="starfield"></canvas>

    <section id="start-screen" class="screen">
        <div class="logo">SPACE SURVIVOR</div>

        <div class="subtitle">
            Sobreviva o máximo de tempo possível
        </div>

        <button id="play-button">
            🚀 Jogar
        </button>

        <div class="high-score">
            Maior Recorde:
            <strong id="start-high-score">00:00</strong>
        </div>
    </section>

    <div id="hud" class="hidden">

        <div class="hud-box">
            ⏱️ Recorde:
            <strong id="current-score">00:00</strong>

            <br>

            🏆 Maior:
            <strong id="game-high-score">00:00</strong>
        </div>

        <div id="hearts">
            ❤️❤️❤️
        </div>

    </div>

    <div id="player" class="hidden">
        🚀
    </div>

    <div id="touch-hint" class="hidden">
        Deslize o dedo para mover a nave
    </div>

    <section id="game-over" class="screen hidden">

        <div class="game-over-title">
            VOCÊ FOI ELIMINADO
        </div>

        <div class="final-score">

            Recorde desta partida:

            <br>

            <strong id="final-score">00:00</strong>

            <br><br>

            Maior Recorde:

            <br>

            <strong id="final-high-score">00:00</strong>

        </div>

        <div class="game-buttons">

            <button id="restart-button">
                🎮 Jogar novamente
            </button>

            <button id="exit-button">
                🚪 Sair
            </button>

        </div>

    </section>

</div>






<script>

const game = document.getElementById("game");
const starCanvas = document.getElementById("starfield");
const starCtx = starCanvas.getContext("2d");
const startScreen = document.getElementById("start-screen");
const gameOverScreen = document.getElementById("game-over");
const player = document.getElementById("player");
const hud = document.getElementById("hud");
const touchHint = document.getElementById("touch-hint");
const currentScoreText = document.getElementById("current-score");
const startHighScoreText = document.getElementById("start-high-score");
const gameHighScoreText = document.getElementById("game-high-score");
const finalScoreText = document.getElementById("final-score");
const finalHighScoreText = document.getElementById("final-high-score");
const heartsText = document.getElementById("hearts");
const playButton = document.getElementById("play-button");
const restartButton = document.getElementById("restart-button");
const exitButton = document.getElementById("exit-button");

let playing = false;
let paused = false;
let hearts = 3;
let startTime = 0;
let score = 0;
let highScore = Number(localStorage.getItem("spaceHighScore")) || 0;

let bullets = [];
let meteors = [];

let shield = null;

let hasShield = false;

let shieldBrokenBlink = 0;

let animationFrame;

let lastFrameTime = 0;
let lastBulletTime = 0;
let lastMeteorTime = 0;
let lastScoreTime = 0;

let playerX = window.innerWidth / 2;
let playerY = window.innerHeight * 0.82;

let targetX = playerX;
let targetY = playerY;

let enginePower = 0;

let stars = [];





// quanto maior, mais rápido acompanha o dedo
const movementSmoothness = 0.35;

function formatTime(seconds){

    seconds = Math.floor(seconds);

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;

    return String(minutes).padStart(2,"0") + ":" +
           String(secs).padStart(2,"0");
}

function updateHighScore(){

    startHighScoreText.textContent = formatTime(highScore);
    gameHighScoreText.textContent = formatTime(highScore);
    finalHighScoreText.textContent = formatTime(highScore);

}

updateHighScore();

function startGame(){

    playing = true;

    hearts = 3;
    score = 0;

    startTime = performance.now();

    lastFrameTime = performance.now();
    lastBulletTime = 0;
    lastMeteorTime = 0;
    lastScoreTime = 0;

    playerX = window.innerWidth / 2;
    targetX = window.innerWidth / 2;

    clearObjects();
    createStars();

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    hud.classList.remove("hidden");
    player.classList.remove("hidden");
    touchHint.classList.remove("hidden");

    updateHearts();
    updatePlayer();

    currentScoreText.textContent = "00:00";

    animationFrame = requestAnimationFrame(gameLoop);
}

function updatePlayer(){

    const halfWidth = player.offsetWidth / 2;
    const halfHeight = player.offsetHeight / 2;

    targetX = Math.max(
        halfWidth,
        Math.min(window.innerWidth - halfWidth, targetX)
    );

    targetY = Math.max(
        60,
        Math.min(window.innerHeight - halfHeight - 15, targetY)
    );

    playerX += (targetX-playerX) *
movementSmoothness;

playerY += (targetY-playerY) *
movementSmoothness;

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";
    
    const distance = Math.hypot(
    targetX - playerX,
    targetY - playerY
);

enginePower = Math.min(distance / 40,1);

player.style.setProperty(
    "--engine",
    enginePower
);

}

function gameLoop(currentTime){

    if(!playing) return;

    const deltaTime = Math.min(
        currentTime - lastFrameTime,
        50
    );

    lastFrameTime = currentTime;

    const elapsedSeconds =
        (currentTime - startTime) / 1000;

    score = elapsedSeconds;
    
    //desenha as estrelas 
    drawStars(deltaTime);
    
    
    updateGalaxy(elapsedSeconds);

    updatePlayer();

    if(currentTime - lastScoreTime > 100){

        currentScoreText.textContent =
            formatTime(score);

        lastScoreTime = currentTime;
    }

    const bulletInterval = Math.max(

    90,               // limite mínimo

    200 - elapsedSeconds * 0.10

);

if(currentTime - lastBulletTime > bulletInterval){

    shoot();

    lastBulletTime = currentTime;

}
    

    const meteorInterval = Math.max(
        250,
        1000 - elapsedSeconds * 7
    );

    if(currentTime - lastMeteorTime > meteorInterval){

        createMeteor();

        lastMeteorTime = currentTime;
    }

    moveBullets(deltaTime);
    moveMeteors(deltaTime, elapsedSeconds);
    moveShield(deltaTime);

if(Math.random()<0.002){

    createShield();

}




    checkCollisions();

    animationFrame = requestAnimationFrame(gameLoop);
}







function shoot(){

    if(!playing) return;

    const bullet = document.createElement("div");

    bullet.className = "bullet";

    const rect = player.getBoundingClientRect();

    const x = playerX;
const y = playerY - 40;

    bullet.style.left = (x - 2.5) + "px";
    bullet.style.top = y + "px";

    game.appendChild(bullet);

    bullets.push({
        element: bullet,
        x: x,
        y: y
    });
}

function createMeteor(){

    if(!playing) return;

    const size = 42 + Math.random() * 27;

    const meteor = document.createElement("div");

    meteor.className = "meteor";

    meteor.style.width = size + "px";
    meteor.style.height = size + "px";

    meteor.innerHTML = `
    <div class="meteorTrail"></div>

    <div class="meteor-health">
        <div class="meteor-health-bar"></div>
    </div>

    ✨
`;

    const x = Math.random() *
        (window.innerWidth - size);

    /*
        METEOROS MAIS RESISTENTES

        Antes: aproximadamente 3 a 6 tiros.

        Agora:
        - começam com 8 de vida
        - ganham vida lentamente conforme o tempo passa
        - a nave precisa acertar muito mais tiros
    */

    const health = Math.floor(
        7 + score / 20
    );

    game.appendChild(meteor);

    meteors.push({

        element: meteor,

        x: x,

        y: -size,

        size: size,

        health: health,

        maxHealth: health,

        speed: 130 + Math.random() * 100

    });
}

function moveBullets(deltaTime){

    const seconds = deltaTime / 1000;

    for(let i = bullets.length - 1; i >= 0; i--){

        const bullet = bullets[i];

        bullet.y -= 650 * seconds;

        bullet.element.style.top =
            bullet.y + "px";

        if(bullet.y < -30){

            bullet.element.remove();

            bullets.splice(i,1);
        }
    }
}

function moveMeteors(deltaTime, elapsedSeconds){

    const seconds = deltaTime / 1000;

    /*
        VELOCIDADE PROGRESSIVA

        A velocidade cresce continuamente,
        mas de forma controlada.

        Isso mantém o jogo desafiador
        sem deixar os meteoros absurdamente rápidos.
    */

    const speedMultiplier =
        1 + elapsedSeconds * 0.035;

    for(let i = meteors.length - 1; i >= 0; i--){

        const meteor = meteors[i];

        const speed =
            meteor.speed * speedMultiplier;

        meteor.y += speed * seconds;

        meteor.element.style.left =
            meteor.x + "px";

        meteor.element.style.top =
            meteor.y + "px";

        if(meteor.y > window.innerHeight + 100){

            meteor.element.remove();

            meteors.splice(i,1);
        }
    }
}





function checkCollisions(){

    const playerRect =
        player.getBoundingClientRect();
        
        if(shield){

    const shieldRect=
        shield.element.getBoundingClientRect();

    const playerRect=
        player.getBoundingClientRect();

    if(isColliding(playerRect,shieldRect)){

        hasShield=true;

        shield.element.remove();

        shield=null;

        player.classList.add("shielded");

    }

}








    for(let m = meteors.length - 1; m >= 0; m--){

        const meteor = meteors[m];

        const meteorRect =
            meteor.element.getBoundingClientRect();

        if(isColliding(playerRect, meteorRect)){

            if(hasShield){

    hasShield=false;

    player.classList.remove("shielded");

    player.classList.add("shieldBlink");

    setTimeout(()=>{

        player.classList.remove("shieldBlink");

    },2000);

}else{

    damagePlayer();

}

            createExplosion(
                meteor.x,
                meteor.y
            );
            
            shakeScreen(
    meteor.size / 60
);

            meteor.element.remove();

            meteors.splice(m,1);

            continue;
        }

        for(let b = bullets.length - 1; b >= 0; b--){

            const bullet = bullets[b];

            const bulletRect =
                bullet.element.getBoundingClientRect();

            if(isColliding(bulletRect, meteorRect)){

                meteor.health--;

                bullet.element.remove();

                bullets.splice(b,1);

                const healthBar =
                    meteor.element.querySelector(
                        ".meteor-health-bar"
                    );

                healthBar.style.width =
                    (meteor.health / meteor.maxHealth * 100)
                    + "%";

                if(meteor.health <= 0){

                    createExplosion(
                        meteor.x,
                        meteor.y
                    );

                    meteor.element.remove();

                    meteors.splice(m,1);
                }

                break;
            }
        }
    }
}

function isColliding(a,b){

    return (
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}

function damagePlayer(){

    hearts--;

    updateHearts();

    if(hearts <= 0){

        endGame();
    }
}

function updateHearts(){

    heartsText.textContent =
        "❤️".repeat(hearts) +
        "🖤".repeat(3 - hearts);
}

function createExplosion(x,y){

    createExplosionParticles(x,y);

    shakeScreen(1);

    const explosion =
        document.createElement("div");

    explosion.className = "explosion";

    explosion.textContent = "💥";

    explosion.style.left = x + "px";
    explosion.style.top = y + "px";

    game.appendChild(explosion);

    setTimeout(() => {

        explosion.remove();

    },500);

}


function createExplosionParticles(x,y){

    const colors=[

        "#ffea00",
        "#ffb300",
        "#ff7b00",
        "#ff3d00",
        "#ffffff"

    ];

    for(let i=0;i<18;i++){

        const p=document.createElement("div");

        p.className="spark";

        const angle=Math.random()*Math.PI*2;

        const speed=80+Math.random()*220;

        const size=4+Math.random()*5;

        const color=
            colors[Math.floor(Math.random()*colors.length)];

        p.style.background=color;
        p.style.color=color;

        p.style.width=size+"px";
        p.style.height=size+"px";

        p.style.left=x+"px";
        p.style.top=y+"px";

        game.appendChild(p);

        let px=x;
        let py=y;

        let vx=Math.cos(angle)*speed;
        let vy=Math.sin(angle)*speed;

        let life=0;

        const timer=setInterval(()=>{

            life+=0.016;

            px+=vx*0.016;
            py+=vy*0.016;

            vx*=0.98;
            vy*=0.98;

            p.style.left=px+"px";
            p.style.top=py+"px";

            p.style.opacity=1-life;

            p.style.transform=
                `scale(${1-life})`;

            if(life>=1){

                clearInterval(timer);

                p.remove();

            }

        },16);

    }

}


function endGame(){

    playing = false;

    cancelAnimationFrame(animationFrame);

    if(score > highScore){

        highScore = Math.floor(score);

        localStorage.setItem(
            "spaceHighScore",
            highScore
        );
    }

    clearObjects();

    hud.classList.add("hidden");
    player.classList.add("hidden");
    touchHint.classList.add("hidden");

    finalScoreText.textContent =
        formatTime(score);

    updateHighScore();

    gameOverScreen.classList.remove("hidden");
}

function clearObjects(){

    bullets.forEach(
        bullet => bullet.element.remove()
    );

    meteors.forEach(
        meteor => meteor.element.remove()
    );

    bullets = [];
    meteors = [];
}

playButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);

exitButton.addEventListener(
    "click",
    () => {

        playing = false;

        cancelAnimationFrame(animationFrame);

        clearObjects();

        gameOverScreen.classList.add("hidden");
        startScreen.classList.remove("hidden");

        updateHighScore();
    }
);

document.addEventListener("touchstart",e=>{

    if(!playing) return;

    targetX=e.touches[0].clientX;
    targetY=e.touches[0].clientY;

},{passive:true});


document.addEventListener("touchmove",e=>{

    if(!playing) return;

    targetX=e.touches[0].clientX;
    targetY=e.touches[0].clientY;

},{passive:true});

let mouseDown = false;

document.addEventListener(
    "mousedown",
    () => {

        if(!playing) return;

        mouseDown = true;
    }
);

document.addEventListener("mousemove",e=>{

    if(!playing) return;

    targetX=e.clientX;
    targetY=e.clientY;

});

document.addEventListener(
    "mouseup",
    () => {

        mouseDown = false;
    }
);

document.addEventListener(
    "keydown",
    event => {

        if(!playing) return;

        if(event.key === "ArrowLeft")
            targetX -= 45;

        if(event.key === "ArrowRight")
            targetX += 45;
    }
);

window.addEventListener(
    "resize",
    () => {

        const half =
            player.offsetWidth / 2;

        targetX = Math.max(
            half,
            Math.min(
                window.innerWidth - half,
                targetX
            )
        );
    }
);


function createShield(){

    if(hasShield) return;

    if(shield) return;

    if(Math.random()>0.25) return;

    const div=document.createElement("div");

    div.innerHTML = `
<div class="fallingShieldAura"style="
color:white;
cursor:center;
text-shadow:
  0 0 2px silver,
  0 0 5px silver,
  0 0 10px silver;
"></div>
🛡️️
`;

    div.style.position="absolute";
    div.style.fontSize="40px";

    game.appendChild(div);

    shield={

        element:div,

        x:Math.random()*(window.innerWidth-60),

        y:-50,

        speed:170

    };

}


function moveShield(dt){

    if(!shield) return;

    shield.y+=shield.speed*dt/1000;

    shield.element.style.left=shield.x+"px";
    shield.element.style.top=shield.y+"px";

    if(shield.y>window.innerHeight){

        shield.element.remove();

        shield=null;

    }

}


function shakeScreen(power = 1){

    game.style.animation = "none";

    game.offsetHeight;

    game.style.animation =
        `screenShake ${0.18 * power}s`;

}




/*Galaxia*/

function updateGalaxy(time){

    if(time<60){

        game.style.background=
        "radial-gradient(circle,#18356f 0%,#050a1f 60%,#010106 100%)";

    }

    else if(time<120){

        game.style.background=
        "radial-gradient(circle,#52217e 0%,#170326 60%,#05010b 100%)";

    }

    else if(time<180){

        game.style.background=
        "radial-gradient(circle,#0d5ca8 0%,#021630 60%,#000814 100%)";

    }

    else if(time<240){

        game.style.background=
        "radial-gradient(circle,#8c1b30 0%,#250109 60%,#080102 100%)";

    }

    else{

        game.style.background=
        "radial-gradient(circle,#2d2d2d 0%,#090909 35%,#000000 100%)";

    }

}



// estrelas

function createStars(){

    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;

    stars = [];

    for(let i=0;i<250;i++){

        stars.push({

            x:Math.random()*starCanvas.width,

            y:Math.random()*starCanvas.height,

            size:Math.random()*2+1,

            speed:20+Math.random()*60,

            alpha:0.2+Math.random()*0.8,

twinkle:Math.random()*Math.PI*2,

twinkleSpeed:0.5+Math.random()*2

        });

    }

}

function drawStars(deltaTime){

    starCtx.clearRect(
        0,
        0,
        starCanvas.width,
        starCanvas.height
    );

    const dt = deltaTime/1000;

    for(const star of stars){

        star.y += star.speed * dt;

        if(star.y > starCanvas.height){

            star.y = -5;

            star.x = Math.random()*starCanvas.width;

        }
        
        
        star.twinkle += star.twinkleSpeed * dt;

const alpha =
    star.alpha *
    (0.65 + Math.sin(star.twinkle) * 0.35);
    
    

        starCtx.globalAlpha = alpha;

        starCtx.beginPath();

        starCtx.fillStyle = "white";

        starCtx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI*2
        );

        starCtx.fill();

    }

    starCtx.globalAlpha = 1;

}
